openapi: 3.0.3

info:
  title: MiniBlog API
  description: API REST para la gestión de autores y publicaciones de un MiniBlog.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Servidor local

paths:
  /authors:
    get:
      summary: Obtener todos los autores
      responses:
        "200":
          description: Lista de autores obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Author"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Crear un autor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorInput"
      responses:
        "201":
          description: Autor creado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Author"
        "400":
          description: Datos inválidos o email ya existente
        "500":
          $ref: "#/components/responses/InternalServerError"

  /authors/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID del autor
        schema:
          type: integer
          minimum: 1

    get:
      summary: Obtener un autor por ID
      responses:
        "200":
          description: Autor encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Author"
        "400":
          description: ID inválido
        "404":
          description: Autor no encontrado
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      summary: Actualizar un autor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorInput"
      responses:
        "200":
          description: Autor actualizado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Author"
        "400":
          description: Datos o ID inválidos
        "404":
          description: Autor no encontrado
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Eliminar un autor
      responses:
        "204":
          description: Autor eliminado correctamente
        "400":
          description: ID inválido
        "404":
          description: Autor no encontrado
        "500":
          $ref: "#/components/responses/InternalServerError"

  /posts:
    get:
      summary: Obtener todos los posts
      responses:
        "200":
          description: Lista de posts obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Crear un post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Post creado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: Datos inválidos
        "404":
          description: Autor no encontrado
        "500":
          $ref: "#/components/responses/InternalServerError"

  /posts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID del post
        schema:
          type: integer
          minimum: 1

    get:
      summary: Obtener un post por ID
      responses:
        "200":
          description: Post encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: ID inválido
        "404":
          description: Post no encontrado
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      summary: Actualizar un post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "200":
          description: Post actualizado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: Datos o ID inválidos
        "404":
          description: Post o autor no encontrado
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Eliminar un post
      responses:
        "204":
          description: Post eliminado correctamente
        "400":
          description: ID inválido
        "404":
          description: Post no encontrado
        "500":
          $ref: "#/components/responses/InternalServerError"

  /posts/author/{authorId}:
    get:
      summary: Obtener posts de un autor
      parameters:
        - name: authorId
          in: path
          required: true
          description: ID del autor
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Posts del autor obtenidos correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
        "400":
          description: ID inválido
        "404":
          description: Autor no encontrado
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    Author:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Ana García
        email:
          type: string
          format: email
          example: ana@example.com
        bio:
          type: string
          nullable: true
          example: Desarrolladora full-stack apasionada por Node.js
        created_at:
          type: string
          format: date-time

    AuthorInput:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          example: Manuel Martinez
        email:
          type: string
          format: email
          example: manuel@example.com
        bio:
          type: string
          nullable: true
          example: Desarrollador backend

    Post:
      type: object
      properties:
        id:
          type: integer
          example: 1
        author_id:
          type: integer
          example: 1
        title:
          type: string
          example: Introducción a Node.js
        content:
          type: string
          example: Contenido del post sobre Node.js
        published:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time

    PostInput:
      type: object
      required:
        - title
        - content
        - author_id
      properties:
        title:
          type: string
          example: Introducción a Express
        content:
          type: string
          example: Contenido del post sobre Express
        author_id:
          type: integer
          example: 1
        published:
          type: boolean
          example: false

    Error:
      type: object
      properties:
        error:
          type: string
          example: No se puede realizar la operación

  responses:
    InternalServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"